name: Deploy to Production

on:
  push:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://labtech-geolab.herokuapp.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      
      - name: Create deployment
        uses: actions/github-script@v7
        id: create-deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false
            });
            return deployment.data.id;
      
      - name: Deploy to Heroku Production
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_PRODUCTION_APP_NAME }}
        run: |
          git push https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_APP_NAME.git HEAD:main --force
      
      - name: Run database migrations
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_PRODUCTION_APP_NAME }}
        run: |
          heroku run npm run migrate --app $HEROKU_APP_NAME
      
      - name: Wait for deployment
        run: sleep 60
      
      - name: Health check
        id: health-check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.HEROKU_PRODUCTION_APP_NAME }}.herokuapp.com/health)
          if [ $response -eq 200 ]; then
            echo "✓ Production deployment successful"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "✗ Production deployment failed (HTTP $response)"
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Update deployment status (success)
        if: steps.health-check.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://${{ secrets.HEROKU_PRODUCTION_APP_NAME }}.herokuapp.com',
              description: 'Deployment successful'
            });
      
      - name: Update deployment status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.result }},
              state: 'failure',
              description: 'Deployment failed'
            });
      
      - name: Create GitHub Release
        if: steps.health-check.outputs.status == 'success'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            Production deployment successful
            
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            Changes: https://github.com/${{ github.repository }}/compare/v${{ github.run_number - 1 }}...v${{ github.run_number }}
          draft: false
          prerelease: false
      
      - name: Notify Slack (Success)
        if: success() && secrets.SLACK_WEBHOOK_URL
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ✅ Production Deployment Successful
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            URL: https://${{ secrets.HEROKU_PRODUCTION_APP_NAME }}.herokuapp.com
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Notify Slack (Failure)
        if: failure() && secrets.SLACK_WEBHOOK_URL
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ Production Deployment Failed
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Send email notification (Success)
        if: success() && secrets.EMAIL_TO
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '✅ Production Deployment Successful'
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Production deployment completed successfully.
            
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            URL: https://${{ secrets.HEROKU_PRODUCTION_APP_NAME }}.herokuapp.com
            
            View deployment: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      
      - name: Send email notification (Failure)
        if: failure() && secrets.EMAIL_TO
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ Production Deployment Failed'
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Production deployment failed.
            
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
