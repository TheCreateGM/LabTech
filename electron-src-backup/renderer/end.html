<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabTech GeoLab - End</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- Navigation Header with Back Arrow -->
    <div class="nav-header">
        <button id="end-back-btn" class="nav-btn">⬅</button>
        <div class="nav-title">Test Complete</div>
        <div></div>
    </div>

    <div class="container">
        <div class="content">
            <!-- Completion Message -->
            <h2>Test Completed Successfully!</h2>
            <p>Your test data has been recorded. Choose your next action:</p>
            
            <!-- Action Options -->
            <div class="action-options">
                <!-- Home Button -->
                <button id="home-btn" class="btn btn-primary btn-large">
                    <span class="icon">🏠</span>
                    HOME
                </button>

                <!-- Exit Button -->
                <button id="exit-btn" class="btn btn-large">
                    <span class="icon">⚡</span>
                    EXIT
                </button>
            </div>
        </div>
    </div>

    <!-- Include renderer script -->
    <script src="ts/renderer.js"></script>
</body>
</html>
