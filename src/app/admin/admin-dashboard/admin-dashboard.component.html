<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Admin Dashboard</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <!-- Navigation Menu -->
      <ion-col size="12" size-md="3" size-lg="2" class="admin-nav">
        <ion-list>
          <ion-list-header>
            <ion-label>Navigation</ion-label>
          </ion-list-header>
          
          <ion-item button routerLink="/admin/logs" routerLinkActive="active-link">
            <ion-icon name="list-outline" slot="start"></ion-icon>
            <ion-label>Activity Logs</ion-label>
          </ion-item>
          
          <ion-item button routerLink="/admin/analytics" routerLinkActive="active-link">
            <ion-icon name="bar-chart-outline" slot="start"></ion-icon>
            <ion-label>Analytics</ion-label>
          </ion-item>
          
          <ion-item button routerLink="/admin/monitor" routerLinkActive="active-link">
            <ion-icon name="pulse-outline" slot="start"></ion-icon>
            <ion-label>Real-time Monitor</ion-label>
          </ion-item>
        </ion-list>
      </ion-col>
      
      <!-- Main Content Area -->
      <ion-col size="12" size-md="9" size-lg="10" class="admin-content">
        <router-outlet></router-outlet>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
